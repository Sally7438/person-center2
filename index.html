["人為什麼會產生心理困擾？","「不適應」產生於內外不一致、失去真實的時候。自我概念（社會面具／理想）與真實經驗（當下真實感受）出現落差，人就會痛苦。","例：小美總說「我不在意」，其實被朋友忽略時很受傷。她呈現的是面具，感受卻是真實經驗。"],
["核心病理機制：不一致 (Incongruence)","落差即痛苦：落差越大，行為越不統整。焦慮是警報，不是敵人：提醒你正在用的面具已無法涵蓋真實經驗。防衛機制啟動：不符合自我概念的經驗會被扭曲（合理化）或否認，因此無法被正確象徵。","例：考差的人說「那科本來就沒用」是合理化；說「我根本不在乎成績」是否認。"],
["治療目標：收回評價的中心","目標不是解決眼前的單一問題，而是協助一個人長出完整的整合能力：對經驗開放（放下防衛）、信任自己（把評價中心收回自己身上）、自我指導（願意為生活負責，具備創造力與彈性）。具體往哪走，永遠由當事人決定。","例：從「媽媽會怎麼想？」變成「我自己覺得這樣適合我嗎？」"],
["成為一個人 (On Becoming a Person)","Rogers 寫道：當我能接納地聽自己、做自己時，我才是有效的治療者；我愈願意成為自己，就愈樂意允許你成為你自己；別人對我的評價不能引導我；人的生命是流動、變動的過程，沒有什麼是固著不變的。","例：老師坦承「這題我也要查一下」，不假裝全知，學生反而更敢發問。"]],

sc:{q:"大一的小美對諮商員說：「我真的不在意朋友聚會沒找我，沒什麼啦。」但她說話時聲音微微發抖、眼眶泛紅。依「不一致」的概念，諮商員最佳的回應是？",

{t:"單元3 三大核心態度",
slides:[
["核心概念總覽","Rogers 認為助人者需具備三種核心態度：一致性／真誠 (congruence)、無條件正向關懷 (unconditional positive regard)、正確同理性的了解 (accurate empathic understanding)。三者像土壤，提供當事人成長的環境。","例：一位老師若只會講道理（缺同理）、嘴上說接納卻臉色不耐（缺一致）、只在學生表現好時才讚美（缺無條件），學生都很難真正打開心。"],
["態度一：一致與真誠 (Congruence / Genuineness)","治療師內在的真實體驗與外在表現一致，不掩飾、不裝模作樣。真誠是另外兩個態度的「地基」。溫馨提示：適度的自我揭露是允許的，但必須以「對當事人有實質幫助」為唯一考量。","例：諮商員發現自己剛剛分心，與其假裝一直專心，可以說：「我剛才有點跟不上，想確認我有沒有聽懂你的意思。」這是為了當事人，而非宣洩自己。"],
["態度二：無條件的正向關懷 (UPR)","「照你現在的樣子接納你」，以無占有性的態度接納當事人，不帶評價，亦不求回報。重點在區分：接納 (acceptance) 是理解並看見你的感受與存在價值；認同 (agreement) 是同意你的每一個觀點與行為。UPR 要的是接納，不是認同。","例：學生說「我想報復那個同學」。接納他的憤怒與受傷，不代表認同報復的行為；你可以說：「你被傷得很深，真的很生氣。」"],
["態度三：正確同理性的了解","深入當事人的「內在參考架構」與主觀世界去體會其感受，並維持「as if」狀態：好像自己是對方一樣去感受，但沒有失去「好像」的特質，仍保有自己。","例：當事人說「我在公司像透明人」。你不是去想「如果是我會怎樣」，而是用他的世界去理解：「被忽略的感覺，讓你覺得自己不被需要？」"],
["三種同理形式","講義列出三種同理：1. 主觀式同理、2. 人際式同理、3. 客觀式同理。（講義僅列名稱，以下為常見教科書的補充理解，細節請以課堂說明為準。）主觀式：以自己的經驗與感受去推想對方；人際式：站在對方的位置，理解其感受並回應；客觀式：運用外在資訊或理論作較客觀的理解。","例：朋友失業。主觀式像是「我若失業一定很慌」；人際式是「你一定擔心家計，也覺得失落」；客觀式是「失業常伴隨壓力反應」。"],
["同理 ≠ 同情","同理的關鍵在於保持獨立客觀，不丟失自我（維持「as if」狀態）。同情是為對方感到難過，同理則是進入對方的世界後仍站穩自己。講義並以影片「同理心 vs 同情心」對照說明。","例：同情：「你好可憐。」同理：「你一定很擔心之後的日子，又覺得自己的努力被否定了。」"]],

sc:{q:"大學生阿凱對諮商員說：「我考試作弊被抓到，我覺得自己超爛的，也不想被別人知道。」諮商員心裡其實不認同作弊。依三種核心態度，最佳回應是？",
o:["「作弊是不對的，你應該先去自首。」","「聽起來你很自責，也很害怕被別人知道。我會在這裡聽你說，不會因為這件事評價你。」","「別難過，大家都有犯錯的時候，沒關係啦。」","「我完全認同你，作弊其實沒什麼。」"],a:1,
e:"最佳解答是 B。B 同理了阿凱的感受（自責、害怕）與理由，並以不評價的態度接納「人」；同時諮商員沒有假裝認同作弊，維持真誠。A 是評價與指導；C 屬輕描淡寫的安慰，忽略感受；D 把接納誤當成認同，違反一致與真誠。"}},
{t:"單元4 同理心實踐",
slides:[
["同理心練習四步驟","講義列出同理心練習的四個步驟：1. 開放姿勢、2. 簡述語意、3. 情感反映、4. 同理心。前三步是基本功，整合起來就成為同理心。","例：學生低著頭說「我今天又跟媽媽吵架了」。先面向他、身體微微前傾（開放姿勢），再簡述「你今天跟媽媽起了衝突」，接著反映「聽起來你很難過」。"],
["簡述語意","用自己的話，簡要敘述來談者的談話內容。目的：(1) 讓來談者知道我們正在認真瞭解他所說的；(2) 核對我們所理解的是對方所欲傳達的意思；(3) 聚焦於一個特定的情境、事件、想法或行為上。注意事項：不要講得比來談者的話還長；等個案講到一個段落，趁機回應。","例：來談者講了三分鐘工作壓力。你說：「所以你這個月同時接了三個案子，主管又臨時加了會議。」短短一句，就能讓他確認「你有聽懂」。"],
["安慰人雷區","講義列出四類常見但無效的回應：(1) 質問與建議：「你為什麼要這樣想？你不要XXX不就可以ooo了嗎？」(2) 否定情緒：「不要想那麼多、不要難過啦…」(3) 簡化歸因：「你之所以每天忍不住傷心，就是因為不夠忙」(4) 比較苦難：「這算什麼？上次我比你倒楣多了……」","改寫：把「不要難過啦」改成「聽起來這件事讓你很難過。」前者要對方停止感受，後者先看見感受。"],
["情感反映","情感反映句型：「聽起來…＋事件＋情緒字眼」，或「你覺得（情緒）＋事件」。例句：「聽起來，他這樣的行為，讓你很憤怒。」「你覺得自己很糟糕。」「似乎你感到左右為難，不知道該站在哪一邊。」講義附有情緒語詞列表，如：憤怒、生氣、委屈、疲憊、焦慮、無奈、沮喪、無力、孤單、受傷、悲傷、失望、矛盾、興奮、安心、感激等。","練習：來談者說「我才和媽媽吵了一架，她說我懶惰所以永遠不會成功。為什麼她不能像我朋友的媽媽一樣支持我？」回應：「你對媽媽充滿憤怒」「你覺得很受傷，因為媽媽的不信任」。"],
["同理心 = 簡述語意 + 情感反映","初層次同理心包含四種內容：同理來談者的內容（你剛剛說的是…；你是說…）、感受（你覺得……；你感到……）、理由（你覺得……因為；因為……所以你認為……）、意義（你的意思是……；你認為……）。","例：「你是說（內容）自己被同事忽略，覺得（感受）很失落，因為（理由）你一直很努力，你認為（意義）自己不被需要。」"],
["同理心的四個層次","第一級「雞同鴨講」：完全無視對方表達的內容與感受。第二級「表面功夫」：聽到內容，但忽略感受。第三級「有一點感動」：理解內容也理解感受並回饋。第四級「包含所有資訊」：整合語言、表情、語氣、姿勢等訊息後再回應，除了同理，還能幫助對方更瞭解自己。","記憶法：一級沒在聽、二級只聽事、三級聽事也聽心、四級整合全部並促進自我了解。"],
["四層次對照練習","個案說：「唉！我什麼事都作不成。我拼命的幹，結果還是一無所獲，已經白混了兩個月了。」第一級：「嘿！今天真有意思！你知不知道統一獅輸了？」（根本沒聽）第二級：「我也發現到你什麼事都沒有做成。」（只有內容）第三級：「你一定很煩，因為你覺得一事無成。」（內容加感受）第四級：「你一定覺得壓力很大，好像註定要失敗，而且把壓力壓在自己身上，讓自己覺得不如人。」（整合並深化）","自我檢查：你最近一次回應別人時，大約落在第幾級？"]],
cards:[["開放姿勢","Open posture","/ˈoʊpən ˈpɑːstʃər/"],["簡述語意","Paraphrasing","/ˈpærəfreɪzɪŋ/"],["情感反映","Reflection of feeling","/rɪˈflekʃn əv ˈfiːlɪŋ/"],["情緒語詞","Emotion words","/ɪˈmoʊʃn wɜːrdz/"],["初層次同理心","Primary-level empathy","/ˈpraɪmeri ˈlevl ˈempəθi/"],["內容","Content","/ˈkɑːntent/"],["感受","Feeling","/ˈfiːlɪŋ/"],["理由","Reason","/ˈriːzn/"],["意義","Meaning","/ˈmiːnɪŋ/"],["安慰","Reassurance","/ˌriːəˈʃʊrəns/"]],

["「不要想那麼多、不要難過啦」屬於？",["有效的情感反映","安慰人雷區","簡述語意","第四級同理"],1,"這類回應要求對方停止感受，是講義的安慰人雷區。"],
["情感反映的句型為何？",["聽起來…＋事件＋情緒字眼","你應該…＋建議","為什麼…＋質問","我以前也…＋自己的經驗"],0,"例如「聽起來，他這樣的行為，讓你很憤怒。」"],

["「聽到對方語言表達的內容，卻忽略感受」是第幾級同理？",["第一級","第二級","第三級","第四級"],1,"第二級「表面功夫」只聽到內容。"]],
sc:{q:"高二的小宇說：「期中考我準備了好幾週，成績出來卻比上次還差，我媽還說我不夠認真。我真的不知道還能怎麼辦。」下列哪一個回應的同理層次最高？",
o:["「別想那麼多，下次再努力就好了。」","「你是說，你準備很久成績卻退步，媽媽又說你不夠認真。」","「你一定很委屈又很挫折，因為你很努力卻沒有得到肯定，現在也有點不知所措。」","「我高中時考更差，你這算什麼。」"],a:2,
e:"最佳解答是 C。C 同時回應內容（努力卻退步）、感受（委屈、挫折、不知所措）與理由（沒有得到肯定），並整合成一句話，屬第三級以上。B 只有簡述語意（第二級）；A 是安慰人雷區，否定情緒並急著給方向；D 是比較苦難，把焦點拉回自己，接近第一級。"}},
{t:"單元5 改變歷程",
slides:[
["改變的氣候：六個充分必要條件","Rogers (1957) 提出：只要下列六個條件持續存在一段時間，建設性的人格改變「必然」發生。(1) 兩個人有心理上的接觸；(2) 當事人處在不一致或焦慮的狀態；(3) 治療師在關係中是一致的；(4) 治療師能表達對當事人無條件的正向關懷；(5) 治療師體驗並傳達對個案內在參考架構的同理性理解；(6) 當事人感知到治療師的無條件正向關懷與同理理解。","例：高中生小凱被老師帶來諮商室。若他全程不看你（缺條件1），或覺得你只是在完成任務（缺條件6），再好的技巧也不會讓他改變。"],
["六個條件如何運作","可分成三組：關係與狀態（條件1、2：雙方有心理接觸、當事人處於不一致與焦慮）；治療師給予（條件3、4、5：一致、無條件正向關懷、同理）；當事人接收（條件6：當事人成功感受到這份同理與關懷）。治療師的三個核心態度，必須被當事人「感受到」才算數。","例：你心裡很接納他，但語氣急促、一直看錶。小凱感受到的是被催促，條件6就沒有成立。"],
["找到自己的三個階段","講義列出三個階段：1. 願意穿透假面具；2. 對感覺體驗；3. 在體驗中發現自我。這與單元2的假面具（自我概念）與真實經驗的落差相呼應：先放下面具，再接觸感受，最後在感受中找到真實的自己。","例：一個總是說「我沒事」的人，先能對信任的人說出「其實我有點累」（穿透面具），接著去感受累裡面的委屈，最後發現自己一直在討好別人。"],
["個人中心治療歷程的七個階段（上）","依 Rogers (1961)。第一階段「僵化與封閉」：不願談論自己，否認或無法察覺感受。第二階段「開始有限度表達」：稍微願意表達，但主要談外在事件，仍把問題歸因於外界。第三階段「開始談論自我」：能描述過去感受，但把感受當成客體，難以直接經驗當下情緒。第四階段「情緒與自我概念逐漸鬆動」：開始接近當下感受，察覺內在矛盾，質疑原有信念，萌生自我責任感。","當事人說法：一「我沒什麼問題，都是別人有問題。」二「都是主管要求太多，才讓我這麼痛苦。」三「以前我總是很害怕別人不喜歡我。」四「我好像一直覺得自己不值得被愛，也許這只是我的想法。」"],
["個人中心治療歷程的七個階段（下）","第五階段「更能直接表達當下感受」：情緒表達更自由，逐漸承認感受屬於自己。第六階段「充分而直接地經驗情緒」：過去被壓抑的感受能在當下被充分經驗和接納，自我與經驗更趨一致。第七階段「開放、流動與持續成長」：能信任自己的經驗，彈性調整自我概念，自主選擇並持續成長。","當事人說法：五「我現在真的很難過，也發現自己很怕被拒絕。」六「此刻我感覺到自己的悲傷，也能允許自己有這種感受。」七「我可以接納自己的感受，也相信自己能因應新的經驗而改變。」"],
["美好人生的特徵與全景藍圖","美好人生是一個過程，其特徵是：對體驗益發的開放、更為實存的生活、益發信賴自身的反應。全景藍圖把整個架構串起來：底層是 3 個核心態度（環境土壤），中間是 6 個充分必要條件（催化機制），內圈是 7 個歷程階段（當事人成長軌跡），外圈是 4 個發展階段（理論的時間維度）。","記憶法：土壤（3態度）→ 催化（6條件）→ 成長（7階段）→ 理論演進（4階段）。"]],

sc:{q:"大學生阿宏在第三次晤談說：「以前我總是很害怕別人不喜歡我，所以什麼都說好。」他的語氣平淡，像在講別人的故事。依七個階段，他最像在哪一階段？諮商員最佳的回應是？",
o:["「所以你應該學著說不，我們來練習拒絕。」","「你很早就看見自己總是為了不被討厭而說好；現在說起這件事，你心裡浮現什麼感覺？」","「這只是過去的事，不要再想了。」","「你現在是第三階段，要趕快進到第五階段。」"],a:1,
e:"最佳解答是 B。阿宏能描述過去的感受，但把感受當成客體，較像第三階段。B 先同理他已看見的內容（理解與接納），再邀請他靠近當下感受，順著歷程前進。A 是指導，替他決定方向；C 是安慰人雷區，否定感受；D 催促階段，違背信任當事人自我步調的立場。"}},
{t:"單元6 親子溝通與遊戲治療",
slides:[
["有條件 vs 無條件的積極關注：情境一「成績考不好」","有條件：媽媽說「你考這麼差，讓我好失望噢！下次如果考到 90 分以上，我才帶你去吃冰淇淋。」孩子小聲回「喔……」。無條件：媽媽說「看到成績也許你自己也有點難過吧？沒關係，這只是一次測驗，我愛你不會因為成績改變。我們一起來看看下次有什麼地方可以做得更好，好嗎？」孩子回「嗯……謝謝媽媽」。","重點：有條件是「表現好才會被愛」，無條件是「你這個人被愛，行為可以一起調整」。"],
["情境二：打破花瓶","有條件：爸爸說「你怎麼這麼不小心！剛不是提醒過你要注意了嗎！你哥就不會這樣，跟他多學學，我就會比較喜歡跟你玩了。」孩子眼眶紅說「對不起……」。無條件：爸爸說「啊，花瓶破了，沒關係，人沒受傷最重要。每個人都有不小心的時候。我們一起來清理，然後想想以後怎麼避免，好嗎？」孩子點點頭說「嗯，我會小心」。","觀察：有條件的回應常帶有比較與收回愛的訊息，孩子轉而道歉、自責；無條件的回應讓孩子感到安全，願意一起解決問題。"],
["有助益性的親子溝通訊息","講義整理四個訊息：「我在這裡陪你」（我對你的世界有興趣）、「我聽到你要表達的訊息」、「我瞭解你」、「我關心你」。","例：孩子說「我今天不想去學校」。家長可以說：「你今天心情不太好（聽到），學校可能發生了些事（瞭解），我想聽聽看，我在這裡。」"],
["遊戲治療的五個技巧","講義列出：追蹤描述、反映式傾聽、鼓勵、回歸責任權、設限。（講義僅列名稱，以下為遊戲治療常見的說明，細節請以課堂為準。）追蹤描述：用話語描述孩子正在做的事；反映式傾聽：反映孩子表達的感受；鼓勵：認可孩子的努力與過程；回歸責任權：把選擇與決定的責任還給孩子；設限：在安全與必要的界線上說明限制。","例：孩子疊積木。追蹤：「你把積木一塊一塊疊高了。」反映：「你好開心。」鼓勵：「你很用心在喋。」回歸責任：「這個你可以自己決定。」"],
["與兒童建立關係的原則（上）","依 Landreth《遊戲治療建立關係的藝術》整理：我不是無所不知，所以不強求；我需要被愛，所以對孩子開放自己；我想接納自己的童稚，所以以驚奇與敬畿接受孩子啓發；我對童年所知有限，所以允許兒童教導我；我在掙扎中學得最多，所以願意在兒童掙扎時同行；我需要安全庫護所，所以提供這樣的處所；我喜歡被完全接納，所以欣賞孩子原本的樣貌；我會犯錯，所以容忍孩子的人性面。","例：孩子說「這樣才對啦，阿姨你不懂」。大人不急著糾正，說：「那你教教我，怎麼玩才對？」"],
["與兒童建立關係的原則（下）","我用內斂與表情回應現實，所以要放下自以為對的方式，用孩子的方式進入他們的世界；我會因當答案提供者而有優越感，所以保護兒童免於我這種需要；安全時能經驗更完整的自己，所以互動中保持一致性；只有我能決定自己的人生，所以不指導孩子該過什麼生活；我的知識多來自經驗，所以鼓勵兒童去經驗；希望與生活的意志來自內在，所以確認並肯定孩子的意志與自我；我無法驅走孩子的傷害、恐懼、挫折與失望，所以安撫這些打擊；無助時會害怕，所以以親切、溫和、柔軟之心輕觸孩子的內在世界。","例：孩子把娃娃的頭發剪掉了。大人不急著教訓或指導，先說：「你想試試看剪頭髮。」鼓勵他經驗並一起討論結果。"],
["結語：信任人的內在成長力量","真正的改變，往往不是變成別人期待的樣子，而是回到那個被壓抑已久的、原本就值得被愛的自己。不只在諮商室，而是在每一個關係裡。","反思：在你的生活中，你能為誰提供這樣「真實且溫暖」的心理空間？"]],

的生活負責，在第四階段開始萌生。','Existential living':'更為實存的生活，活在當下而非被固定框架限制。','Self-trust':'益發信賴自身的反應與經驗。','Conditional positive regard':'表現好才被愛，把關愛與條件綁在一起。','Parent–child communication':'親子之間傳遞「我陪你、我聽到、我懂你、我關心你」的互動。','Play therapy':'以遊戲作為孩子的語言，在安全關係中表達與成長。','Tracking':'用話語描述孩子正在做的事，如「你把積木疊高了」。','Reflective listening':'反映孩子表達的感受，如「你好開心」。','Encouragement':'肯定孩子的努力與過程，而非只稱讚結果。','Returning responsibility':'把選擇與決定的責任還給孩子，不替他做。','Limit setting':'在安全與必要處說明界線，同時接納孩子的感受。','Safe haven':'讓孩子感到安全、可以做自己的地方。','Authority':'扮演提供答案的角色；與兒童互動時要避免被這種需要驅動。'};
